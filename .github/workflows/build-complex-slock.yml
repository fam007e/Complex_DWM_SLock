name: Release Complex SLock Binary

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'assets/**'
      - 'Makefile'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential \
            libx11-dev libxext-dev libxrandr-dev libxft-dev libxrender-dev \
            libimlib2-dev libfreetype6-dev libfontconfig-dev \
            libxinerama-dev libxcb-xinerama0-dev libpam0g-dev

      - name: Build
        run: |
          make clean
          make

      - name: Create release
        run: |
          version=$(make -s print-version)
          tag="v${version}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            exit 0
          fi

          {
            echo "## Installation notes"
            echo
            echo "- The binary is dynamically linked against Ubuntu's current libraries. On other distros, build from source."
            echo "- slock must be setuid root to work with PAM:"
            echo "  \`sudo chown root slock && sudo chmod 4755 slock\`"
            echo "- Place \`avatar.png\` at \`/usr/local/share/slock/avatar.png\`."
            echo
            echo "## Changelog"
            echo
            git log --pretty=format:"* %s (%h)" -n 20
          } > release-notes.md

          gh release create "$tag" \
            slock assets/images/avatar.png \
            --target "$GITHUB_SHA" \
            --title "Release ${tag}" \
            --notes-file release-notes.md
